<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fincash - Entrar ou Cadastrar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-800 rounded-2xl shadow-2xl border border-slate-700/60 p-8">
        
        <!-- Logo -->
        <div class="flex items-center justify-center gap-3 mb-8">
            <div class="bg-blue-600 p-2.5 rounded-xl text-white shadow-lg">
                <i class="fa-solid fa-chart-line text-2xl"></i>
            </div>
            <span class="text-3xl font-extrabold tracking-tight text-white">fincash</span>
        </div>

        <!-- Abas (Login / Cadastro) -->
        <div class="flex border-b border-slate-700 mb-6">
            <button id="tab-login" onclick="switchTab('login')" class="w-1/2 py-3 text-center font-semibold text-blue-500 border-b-2 border-blue-500 transition">
                Entrar
            </button>
            <button id="tab-register" onclick="switchTab('register')" class="w-1/2 py-3 text-center font-semibold text-slate-400 border-b-2 border-transparent hover:text-slate-200 transition">
                Cadastrar
            </button>
        </div>

        <!-- Mensagens de Alerta (Sucesso / Erro) -->
        <div id="alert-box" class="hidden p-3 mb-4 text-sm rounded-xl"></div>

        <!-- FORMULÁRIO DE LOGIN -->
        <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Telegram ID ou E-mail</label>
                <div class="relative">
                    <i class="fa-solid fa-user absolute left-3.5 top-3.5 text-slate-500"></i>
                    <input type="text" id="login-identifier" required placeholder="Seu ID do Telegram ou e-mail" class="w-full pl-10 pr-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-blue-500 text-white placeholder-slate-500">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Senha</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-3.5 top-3.5 text-slate-500"></i>
                    <input type="password" id="login-password" required placeholder="••••••••" class="w-full pl-10 pr-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-blue-500 text-white placeholder-slate-500">
                </div>
            </div>

            <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl transition duration-200 shadow-lg shadow-blue-600/30">
                Entrar no Dashboard
            </button>
        </form>

<!-- FORMULÁRIO DE CADASTRO -->
<form id="form-register" onsubmit="handleRegister(event)" class="space-y-4 hidden">
    <div>
        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Nome Completo</label>
        <div class="relative">
            <i class="fa-solid fa-id-card absolute left-3.5 top-3.5 text-slate-500"></i>
            <input type="text" id="reg-name" required placeholder="Seu nome" class="w-full pl-10 pr-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-blue-500 text-white placeholder-slate-500">
        </div>
    </div>

    <!-- E-MAIL -->
    <div>
        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">E-mail</label>
        <div class="relative">
            <i class="fa-solid fa-envelope absolute left-3.5 top-3.5 text-slate-500"></i>
            <input type="email" id="reg-email" required placeholder="seu@email.com" class="w-full pl-10 pr-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-blue-500 text-white placeholder-slate-500">
        </div>
    </div>

    <!-- TELEFONE -->
    <div>
        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Telefone</label>
        <div class="relative">
            <i class="fa-solid fa-phone absolute left-3.5 top-3.5 text-slate-500"></i>
            <input type="tel" id="reg-phone" required placeholder="(11) 99999-9999" class="w-full pl-10 pr-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-blue-500 text-white placeholder-slate-500">
        </div>
    </div>

    <!-- SENHA -->
    <div>
        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Senha</label>
        <div class="relative">
            <i class="fa-solid fa-lock absolute left-3.5 top-3.5 text-slate-500"></i>
            <input type="password" id="reg-password" minlength="6" required placeholder="••••••••" class="w-full pl-10 pr-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-blue-500 text-white placeholder-slate-500">
        </div>
    </div>

    <!-- REPITA A SENHA -->
    <div>
        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Repita a Senha</label>
        <div class="relative">
            <i class="fa-solid fa-lock absolute left-3.5 top-3.5 text-slate-500"></i>
            <input type="password" id="reg-confirm-password" minlength="6" required placeholder="••••••••" class="w-full pl-10 pr-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-blue-500 text-white placeholder-slate-500">
        </div>
    </div>

    <button type="submit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl transition duration-200 shadow-lg shadow-emerald-600/30">
        Criar Conta
    </button>
</form>

    </div>

    <script>
        function switchTab(tab) {
            const loginForm = document.getElementById('form-login');
            const regForm = document.getElementById('form-register');
            const tabLogin = document.getElementById('tab-login');
            const tabReg = document.getElementById('tab-register');
            const alertBox = document.getElementById('alert-box');

            alertBox.classList.add('hidden');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                regForm.classList.add('hidden');
                tabLogin.className = "w-1/2 py-3 text-center font-semibold text-blue-500 border-b-2 border-blue-500 transition";
                tabReg.className = "w-1/2 py-3 text-center font-semibold text-slate-400 border-b-2 border-transparent hover:text-slate-200 transition";
            } else {
                loginForm.classList.add('hidden');
                regForm.classList.remove('hidden');
                tabReg.className = "w-1/2 py-3 text-center font-semibold text-emerald-500 border-b-2 border-emerald-500 transition";
                tabLogin.className = "w-1/2 py-3 text-center font-semibold text-slate-400 border-b-2 border-transparent hover:text-slate-200 transition";
            }
        }

        function showAlert(msg, isError = false) {
            const alertBox = document.getElementById('alert-box');
            alertBox.classList.remove('hidden', 'bg-red-500/20', 'text-red-300', 'border-red-500', 'bg-emerald-500/20', 'text-emerald-300', 'border-emerald-500');
            
            if (isError) {
                alertBox.classList.add('bg-red-500/20', 'text-red-300', 'border', 'border-red-500/50');
            } else {
                alertBox.classList.add('bg-emerald-500/20', 'text-emerald-300', 'border', 'border-emerald-500/50');
            }
            alertBox.textContent = msg;
        }

      // 🟢 FUNÇÃO DE LOGIN ATUALIZADA
async function handleLogin(e) {
    e.preventDefault();
    const identifier = document.getElementById('login-identifier').value.trim();
    const password = document.getElementById('login-password').value;

    // 1. Validação básica de campo vazio no login
    if (!identifier || !password) {
        showAlert('Preencha o usuário/e-mail e a senha!', true);
        return;
    }

    try {
        const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ identifier, password })
        });

        const data = await res.json();
        
        if (res.ok) {
            window.location.href = '/'; // Login correto -> Redireciona
        } else {
            // 🛑 Exibe mensagem quando a senha ou e-mail/usuário estiverem errados
            showAlert(data.erro || 'E-mail, usuário ou senha incorretos!', true);
        }
    } catch (err) {
        showAlert('Erro de conexão com o servidor', true);
    }
}

// 🟢 FUNÇÃO DE CADASTRO ATUALIZADA
async function handleRegister(e) {
    e.preventDefault();
    
    const name = document.getElementById('reg-name').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const phone = document.getElementById('reg-phone').value.trim();
    const password = document.getElementById('reg-password').value;
    const confirmPassword = document.getElementById('reg-confirm-password').value;

    // 1. Validação de preenchimento dos campos
    if (!name || !email || !phone || !password || !confirmPassword) {
        showAlert('Por favor, preencha todos os campos do formulário!', true);
        return;
    }

    // 2. Validação de e-mail
    if (!email.includes('@')) {
        showAlert('O e-mail digitado é inválido! Falta o caractere "@".', true);
        return;
    }

    // 3. Validação de senhas divergentes
    if (password !== confirmPassword) {
        showAlert('As senhas não coincidem! Verifique e tente novamente.', true);
        return;
    }

    try {
        const res = await fetch('/api/cadastrar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, email, phone, password })
        });

        const data = await res.json();
        
        if (res.ok) {
            showAlert("Conta criada com sucesso! Faça login.");
            setTimeout(() => switchTab('login'), 1500);
        } else {
            showAlert(data.erro || 'Erro ao realizar o cadastro.', true);
        }
    } catch (err) {
        showAlert('Erro de conexão com o servidor', true);
    }
}
    </script>
</body>
</html>
